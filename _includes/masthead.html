{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">

      <nav id="site-nav" class="greedy-nav" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        
        <!-- Left: Site Title -->
        <ul class="visible-links left-links" style="display: flex; margin: 0;">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
        </ul>

        <!-- Hamburger button (must be before .visible-links) -->
        <button>
          <div class="navicon"></div>
        </button>

        <!-- Right: Nav links -->
        <ul class="visible-links right-links" style="display: flex; gap: 1rem; margin: 0;">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>

        <!-- Always visible theme toggle -->
        <div id="theme-toggle-wrapper" style="margin-left: 1rem;">
          <a id="theme-toggle" class="masthead__menu-item" style="display: inline-block;">
            <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i>
          </a>
        </div>

        <!-- GreedyNav uses this to overflow hidden links -->
        <ul class="hidden-links hidden"></ul>

      </nav>

    </div>
  </div>
</div>
