{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        
        <!-- Hamburger button for mobile toggle -->
        <button class="greedy-nav__toggle" aria-label="Menu">
          <div class="navicon"></div>
        </button>

        <!-- Nav Links -->
        <ul class="visible-links" style="display: flex; margin: 0;">
          <!-- Site title on the left -->
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          <!-- Theme toggle 
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>-->
        </ul>

        <!-- Overflow menu handled by GreedyNav -->
        <ul class="hidden-links hidden">
          <!-- Navigation links on the right -->
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item">
              <a href="https://rindrafanomezana.github.io/">Home</a>
            </li>
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}

          <!-- Move theme toggle outside of greedy-nav list  -->
          <div id="theme-toggle-wrapper" style="margin-left: 1rem;">
            <a id="theme-toggle" class="masthead__menu-item" style="display: inline-block;">
              <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i>
            </a>
          </div> <!--This is the button to chose theme-->
          
        </ul>
      </nav>
    </div>
  </div>
</div>
