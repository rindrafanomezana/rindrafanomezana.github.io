{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav id="site-nav" class="greedy-nav">

      <!-- Site title on the left -->
      <ul class="visible-links">
        <li class="masthead__menu-item masthead__menu-item--lg persist">
          <a href="{{ base_path }}/">{{ site.title }}</a>
        </li>
      </ul>

      <!-- Hamburger toggle -->
      <button class="greedy-nav__toggle" aria-label="Toggle navigation">
        <div class="navicon"></div>
      </button>

      <!-- Nav links on the right -->
      <ul class="visible-links right-nav" style="margin-left: auto;">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li class="masthead__menu-item">
            <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>

      <!-- Hidden links for overflow -->
      <ul class="hidden-links hidden"></ul>
    </nav>
  </div>
</div>
